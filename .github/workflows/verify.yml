name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SOURCE_DATE_EPOCH: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MACTEX_URL: https://mirror.ctan.org/systems/mac/mactex/mactex-20260324.pkg
      MACTEX_SHA256: e30af0640f51979a95b9f54084456d1e16749b79e12e65bdebd630fb2795ff1e
    steps:
      - name: Check out the numerical release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.13.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.11"
          check-latest: false

      - name: Set up uv 0.9.26
        uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Install checksum-pinned MacTeX 2026.0324
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/mactex-20260324.pkg"
          curl --fail --location --retry 3 "$MACTEX_URL" --output "$package"
          printf '%s  %s\n' "$MACTEX_SHA256" "$package" | shasum -a 256 --check
          sudo installer -pkg "$package" -target /
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          /Library/TeX/texbin/latex --version | grep -F "TeX Live 2026"
          for file in fontenc.sty times.sty type1cm.sty type1ec.sty; do
            /Library/TeX/texbin/kpsewhich "$file" | grep -F "/usr/local/texlive/2026/"
          done

      - name: Install locked Python dependencies
        run: uv sync --frozen

      - name: Run complete frozen verification
        run: make verify
